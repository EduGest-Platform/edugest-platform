[project]
name = "gistar-api"
version = "0.1.0"
description = "EduGest · API FastAPI del Proyecto Final 2 · datos exclusivamente sintéticos"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.118",  # Keep request-scoped dependencies open through StreamingResponse.
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pgvector>=0.4",
  "tzdata",
  "httpx>=0.27",  # Gemini embeddings client (KAN-130); also used by the FastAPI test client
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "error::DeprecationWarning:app.*",
  "ignore:Using `httpx` with `starlette.testclient`",
]
