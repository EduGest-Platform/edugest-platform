name: CI
on:
  push:
    branches: [main, f1-cimientos]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit -p .
      - run: pnpm test
      - run: pnpm build
      - name: Cliente TS sincronizado con contracts/openapi.json
        run: pnpm gen:api && git diff --exit-code src/shared/api/schema.gen.ts

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gistar
          POSTGRES_PASSWORD: gistar
          POSTGRES_DB: gistar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gistar" --health-interval 3s --health-retries 20
    defaults:
      run:
        working-directory: api
    env:
      GISTAR_TEST_DATABASE_URL: postgresql+psycopg://gistar:gistar@localhost:5432/gistar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Migraciones sin deriva respecto a los modelos
        env:
          GISTAR_DATABASE_URL: postgresql+psycopg://gistar:gistar@localhost:5432/gistar_test
        run: alembic upgrade head && alembic check && alembic downgrade base
      - run: pytest

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: render.yaml es YAML válido con los servicios esperados
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyyaml
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import yaml
          d = yaml.safe_load(open('render.yaml'))
          names = {s['name'] for s in d['services']}
          assert names == {'edugest-api', 'edugest-web'}, names
          assert d['databases'][0]['postgresMajorVersion'] == '16'
          assert all(s['autoDeployTrigger'] == 'off' for s in d['services']), 'auto-deploy must stay off'
          print('render.yaml ok')
          PY
      - name: Variables de entorno de CI (valor desechable, solo datos sintéticos)
        run: cp infra/.env.example infra/.env
      - name: Configuración del compose válida
        run: docker compose -f infra/compose.yaml config --quiet
      - name: Levantar db, api, mlflow y web
        run: docker compose -f infra/compose.yaml up -d --build --wait
      - name: Prueba de humo
        run: bash infra/smoke-test.sh
      - name: Registros del compose si algo falla
        if: failure()
        run: docker compose -f infra/compose.yaml logs --no-color
      - name: Limpieza
        if: always()
        run: docker compose -f infra/compose.yaml down -v
