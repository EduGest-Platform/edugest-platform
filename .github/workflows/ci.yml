name: CI
on:
  push:
    branches: [main, f1-cimientos]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit -p .
      - run: pnpm test
      - run: pnpm build
      - name: Cliente TS sincronizado con contracts/openapi.json
        run: pnpm gen:api && git diff --exit-code src/shared/api/schema.gen.ts

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gistar
          POSTGRES_PASSWORD: gistar
          POSTGRES_DB: gistar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gistar" --health-interval 3s --health-retries 20
    defaults:
      run:
        working-directory: api
    env:
      GISTAR_TEST_DATABASE_URL: postgresql+psycopg://gistar:gistar@localhost:5432/gistar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Migraciones sin deriva respecto a los modelos
        env:
          GISTAR_DATABASE_URL: postgresql+psycopg://gistar:gistar@localhost:5432/gistar_test
        run: alembic upgrade head && alembic check && alembic downgrade base
      - run: pytest
