name: F1 registration E2E
on:
  pull_request:
    paths:
      - 'src/**'
      - 'api/**'
      - '!api/**/*.md'
      - 'infra/**'
      - 'e2e/**'
      - '!e2e/**/*.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'index.html'
      - 'tsconfig.json'
      - 'public/**'
      - 'vite.config.ts'
      - '.github/workflows/e2e-f1.yml'
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-f1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  registration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: F2 enrollment verifier regressions
        run: python -m unittest discover -s e2e/tests -v
      - name: Public catalogue outcome regressions (KAN-227)
        run: node --test e2e/tests/test_public_catalog_outcome.mjs
      - name: Disposable synthetic environment
        run: |
          DB_PASS=$(openssl rand -hex 24)
          DEMO_PASS=$(openssl rand -hex 24)
          echo "::add-mask::$DB_PASS"
          echo "::add-mask::$DEMO_PASS"
          printf 'GISTAR_DB_PASSWORD=%s\nGISTAR_DEMO_PASSWORD=%s\n' "$DB_PASS" "$DEMO_PASS" > infra/.env
          echo "GISTAR_DEMO_PASSWORD=$DEMO_PASS" >> "$GITHUB_ENV"
          echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Start local database, API and web
        run: docker compose -f infra/compose.yaml up -d --build --wait db api web
      - name: Browser journey and repeat-run idempotency
        env:
          WEB_URL: http://localhost:8443/
          GISTAR_API: http://localhost:8000
          E2E_FIXTURE_ID: ci-f1-registration
        run: |
          node e2e/f1-registration.mjs
          node e2e/f1-registration.mjs
      - name: Public catalogue to application, including repeat-run duplicate (KAN-227)
        env:
          WEB_URL: http://localhost:8443/
          GISTAR_API: http://localhost:8000
          E2E_FIXTURE_ID: ci-public-catalog
          E2E_CALL_ID: CONV-IA-2027A
        run: |
          E2E_EXPECT_OUTCOME=created node e2e/public-catalog.mjs
          E2E_EXPECT_OUTCOME=duplicate node e2e/public-catalog.mjs
      - name: Prepare F2 synthetic cohort and teacher (KAN-72)
        run: docker compose -f infra/compose.yaml exec -T -e GISTAR_E2E_FIXTURE=disposable-synthetic api python < e2e/prepare-f2.py
      - name: F2 HTTP admission to attendance and repeat-run integrity (KAN-72)
        env:
          GISTAR_API: http://localhost:8000
          E2E_FIXTURE_ID: ci-f2-admission
        run: |
          node e2e/f2-admission-enrollment.mjs
          docker compose -f infra/compose.yaml exec -T -e GISTAR_E2E_FIXTURE=disposable-synthetic -e E2E_FIXTURE_ID="${E2E_FIXTURE_ID:-local-f2-admission}" api python < e2e/verify-f2.py
          node e2e/f2-admission-enrollment.mjs
          docker compose -f infra/compose.yaml exec -T -e GISTAR_E2E_FIXTURE=disposable-synthetic -e E2E_FIXTURE_ID="${E2E_FIXTURE_ID:-local-f2-admission}" api python < e2e/verify-f2.py
      - name: Learner progress and isolation between browser sessions (KAN-49)
        env:
          WEB_URL: http://localhost:8443/
          GISTAR_API: http://localhost:8000
        run: node e2e/learner-progress.mjs
      - name: Remove disposable data
        if: always()
        run: docker compose -f infra/compose.yaml down -v
